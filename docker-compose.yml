services:

  matching-engine:
    build:
      context: ./matching-engine
    container_name: papertrading-matching-engine
    ports:
      - "9000:9000"
    environment:
      MATCHING_ENGINE_PORT: 9000
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
    container_name: papertrading-ml-service
    ports:
      - "5000:5000"
    environment:
      ML_PORT: 5000
      MODEL_TYPE: ${MODEL_TYPE}
      SEQUENCE_LENGTH: ${SEQUENCE_LENGTH}
      PREDICTION_THRESHOLD: ${PREDICTION_THRESHOLD}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      YAHOO_FINANCE_ENABLED: ${YAHOO_FINANCE_ENABLED}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: papertrading-backend
    ports:
      - "3001:3001"
    environment:
      BACKEND_PORT: 3001
      BACKEND_HOST: 0.0.0.0

      ML_HOST: ml-service
      ML_PORT: 5000

      MATCHING_ENGINE_HOST: matching-engine
      MATCHING_ENGINE_PORT: 9000

      JWT_SECRET: ${JWT_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB}
      MONGODB_ENABLED: "true"
      MONGODB_CONNECT_TIMEOUT_MS: 10000

      DEFAULT_QUANTITY: ${DEFAULT_QUANTITY}
      MIN_ORDER_SIZE: ${MIN_ORDER_SIZE}
      MAX_ORDER_SIZE: ${MAX_ORDER_SIZE}
      PRICE_PRECISION: ${PRICE_PRECISION}

    depends_on:
      - matching-engine
      - ml-service

    restart: unless-stopped